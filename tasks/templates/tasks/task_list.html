{% extends "tasks/base.html" %}

{% block title %}Список задач{% endblock %}

{% block content %}
  <h1>Список задач</h1>
  {% for task in tasks %}
    <div class="card">
      <a href="{% url 'task_detail' task.pk %}">{{ task.title }}</a>
      {% if task.is_done %}
        <span class="badge done">Выполнено</span>
      {% else %}
        <span class="badge todo">Не выполнено</span>
      {% endif %}
    </div>
  {% empty %}
    <p>Задач пока нет.</p>
  {% endfor %}
{% endblock %}
